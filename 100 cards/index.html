<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.18.1/axios.js"></script>
    <link rel="stylesheet" href="style.css">
    <title>Lista de Usuarios</title>
</head>

<body>

    <header>
        <h1>Directorio de Usuarios</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="favoritos.html">Favoritos</a>
        </nav>
    </header>

    <div class="cardcontainer" id="container"></div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const container = document.getElementById("container");
            let favoritos = JSON.parse(localStorage.getItem("favoritos")) || [];

            try {
                let res = await axios.get("https://randomuser.me/api/?results=100");
                let usuarios = res.data.results;

                usuarios.forEach((usuario) => {
                    const esFavorito = favoritos.some(fav => fav.login.uuid === usuario.login.uuid);

                    const card = document.createElement("div");
                    card.classList.add("card");

                    card.innerHTML = `
                        <button class="star-btn ${esFavorito ? 'active' : ''}">★</button>
                        <div class="img-container">
                            <img class="avatar" src="${usuario.picture.large}" alt="Avatar">
                        </div>
                        <div class="info">
                            <h2 class="nombre">👤 ${usuario.name.first} ${usuario.name.last}</h2>
                            <p class="detalle">⚥ Genero: ${usuario.gender}</p>
                            <p class="detalle">🔢 Edad: ${usuario.dob.age} años</p>
                        </div>
                    `;

                    
                    card.addEventListener("click", (e) => {
                        if (e.target.classList.contains("star-btn")) return;
                        localStorage.setItem("usuarioPerfil", JSON.stringify(usuario));
                        window.location.href = "perfil.html";
                    });

                    
                    const starBtn = card.querySelector(".star-btn");
                    starBtn.addEventListener("click", (e) => {
                        e.stopPropagation();

                        let favsActuales = JSON.parse(localStorage.getItem("favoritos")) || [];
                        const index = favsActuales.findIndex(fav => fav.login.uuid === usuario.login.uuid);

                        if (index === -1) {
                            favsActuales.push(usuario);
                            starBtn.classList.add("active");
                        } else {
                            favsActuales.splice(index, 1);
                            starBtn.classList.remove("active");
                        }

                        localStorage.setItem("favoritos", JSON.stringify(favsActuales));
                    });

                    container.appendChild(card);
                });

            } catch (error) {
                console.error("Error al cargar usuarios:", error);
            }
        });
    </script>
</body>

</html>
